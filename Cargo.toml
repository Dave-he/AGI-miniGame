[package]
name = "agi-minigame-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# cocos4-rust = { path = "../cocos4-rust" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

